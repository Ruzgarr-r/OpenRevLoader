# ====================================================================
# rev.ini Configuration File - RevEmu / OpenRevLoader Example
# ====================================================================

[Loader]
# The executable file to launch along with command line arguments.
# Example for Team Fortress 2: hl2.exe -steam -game tf -appid 440 -novid
ProcName = hl2.exe -steam -game tf -appid 440 -novid

[Emulator]
# Enables or disables local caching for emulated content.
CacheEnabled = True

# Path where cached Steam content (GCFs/VCFs/Manifests) is stored.
CachePath = .\SteamApps

# Toggles debug/event logging for the core emulator.
Logging = False

# Path to the RevEmu wrapper DLL relative to the loader directory.
SteamDll = .\steam\Steam.dll

# Set to True to emulate a running Steam client process.
SteamClient = True

# Internal Steam account username used for emulation.
SteamUser = SteamPlayer

# Language used by Source Engine games (e.g., English, Turkish, French).
Language = English

[Log]
# Toggles specific debug logging categories (Set True only for debugging).
FileSystem = False
Account = False
UserID = False

[steamclient]
# Enables logging for steamclient.dll hooks.
Logging = False

# The display name visible to other players in multiplayer matches.
PlayerName = Player

# Enables or disables custom avatar rendering for the client.
Use_avatar = true
